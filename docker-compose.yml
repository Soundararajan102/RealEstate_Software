services:
  # ========================================================
  # 1. PostgreSQL Database Service
  # ========================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-msp_real_estate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-msp_real_estate}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - msp_network

  # ========================================================
  # 2. Backend REST API Service (NestJS + Prisma)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-msp_real_estate}?schema=public"
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-msp_super_secret_jwt_key_2026_durozen_real_estate}
      SMS_PROVIDER: ${SMS_PROVIDER:-SIMULATED}
      SMS_API_KEY: ${SMS_API_KEY:-}
      RUN_SEED: ${RUN_SEED:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4000"
    networks:
      - msp_network
      - dokploy-network

  # ========================================================
  # 3. Frontend Web Portal Service (Next.js 16 Standalone)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - msp_network
      - dokploy-network

# ========================================================
# Persistent Volumes & Network Definitions
# ========================================================
volumes:
  postgres_data:
    driver: local

networks:
  msp_network:
    driver: bridge
  dokploy-network:
    external: true
